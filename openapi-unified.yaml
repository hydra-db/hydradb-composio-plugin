openapi: 3.0.3
info:
  title: HydraDB Unified Rollout Preview
  description: Unpublished rollout preparation. Do not import or enable before production rollout is confirmed.
  version: "1.0.0"
servers:
  - url: https://api.hydradb.com
security:
  - bearerAuth: []
paths:
  /query:
    post:
      operationId: recall_context
      summary: Recall the complete context response
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [database, query]
              properties:
                database:
                  type: string
                  minLength: 1
                collection:
                  type: string
                query:
                  type: string
                mode:
                  type: string
                  enum: [fast, thinking]
                  default: fast
                max_results:
                  type: integer
                  minimum: 1
                  default: 6
                graph_context:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Whole recall envelope. Pass data.llm_prompt verbatim to a model when provided.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  success:
                    type: boolean
                  meta:
                    type: object
                    additionalProperties: true
                  data:
                    $ref: '#/components/schemas/QueryResult'
  /context/ingest:
    post:
      operationId: ingest_context
      summary: Ingest contexts using the unified JSON contract
      description: Explicit unified-only operation. No split selectors or multipart fields. A 202 means queued, not indexed.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [database, context]
              properties:
                database:
                  type: string
                  minLength: 1
                collection:
                  type: string
                context:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Context'
      responses:
        "202":
          description: Ingest acknowledgment. Check per-item results and failed_count; acceptance is asynchronous.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      success_count:
                        type: integer
                      failed_count:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
components:
  parameters:
    ApiVersion:
      name: API-Version
      in: header
      required: true
      description: Explicitly supply API version 2; no assumption that a default injects a header.
      schema:
        type: string
        enum: ["2"]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Context:
      type: object
      additionalProperties: false
      description: Text XOR conversation. Limits are 1 MiB per context and 8 MiB per request. The server validates UTF-8 byte limits, metadata policy, identifiers and ACL principals.
      oneOf:
        - required: [text]
          properties:
            text:
              type: string
              pattern: '\S'
            conversation:
              type: array
              nullable: true
              maxItems: 0
        - required: [conversation]
          properties:
            text:
              type: string
              nullable: true
              pattern: '^\s*$'
            conversation:
              type: array
              minItems: 1
          not:
            properties:
              conversation:
                items:
                  properties:
                    role:
                      enum: [system]
      properties:
        text:
          type: string
          nullable: true
        conversation:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
                pattern: '\S'
        context_id:
          type: string
          description: At most 100 UTF-8 bytes, no commas or reserved att_/cmt_ prefixes.
        title:
          type: string
          description: At most 1024 UTF-8 bytes after trimming.
        user_name:
          type: string
        attributes:
          type: object
          additionalProperties: true
        custom_attributes:
          type: object
          additionalProperties: true
        happened_at:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: A valid YYYY-MM-DD date; the server checks the calendar date.
        enrich:
          type: boolean
        instructions:
          type: string
          maxLength: 4000
        upsert:
          type: boolean
        forceful_relations:
          type: object
          additionalProperties: false
          properties:
            context_ids:
              type: array
              items:
                type: string
            properties:
              type: object
              description: Flat nonreserved scalar properties; at most 1 KiB compact JSON, validated by the server.
              additionalProperties:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
        acl:
          type: array
          items:
            type: string
          description: Omission leaves unrestricted; an explicitly empty array stores private access. Principal policy is enforced by the server.
    QueryChunk:
      type: object
      required: [chunk_id, context_id, score, content]
      properties:
        chunk_id:
          type: string
        context_id:
          type: string
        score:
          type: number
        content:
          type: string
          description: Literal content; do not unwrap JSON-looking text or concatenate enrichment.
        enrichment:
          type: string
        received_at:
          type: string
        chunk_metadata:
          type: object
          additionalProperties: true
          description: CSV row range, not source metadata.
        temporal:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              start_date:
                type: string
                nullable: true
              end_date:
                type: string
                nullable: true
    QueryResult:
      type: object
      required: [chunks, graph, forceful_relations, llm_prompt, tabular_data]
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/QueryChunk'
        graph:
          type: array
          items:
            type: object
            properties:
              origin:
                type: string
                enum: [query_path, chunk_relation]
              path_summary:
                type: string
              triplets:
                type: array
                items:
                  type: object
                  properties:
                    source:
                      $ref: '#/components/schemas/Entity'
                    relation:
                      type: object
                      properties:
                        predicate:
                          type: string
                        context:
                          type: string
                        temporal_details:
                          type: string
                        timestamp:
                          type: number
                          nullable: true
                        relationship_id:
                          type: string
                        chunk_id:
                          type: string
                    target:
                      $ref: '#/components/schemas/Entity'
        forceful_relations:
          type: array
          items:
            type: object
            properties:
              via:
                type: object
                properties:
                  from:
                    type: string
                  to:
                    type: string
              chunk:
                $ref: '#/components/schemas/QueryChunk'
        llm_prompt:
          type: string
          description: Pass verbatim, including whitespace. It can carry evidence with no corresponding JSON field.
        tabular_data:
          type: object
          nullable: true
          additionalProperties: true
    Entity:
      type: object
      properties:
        entity_id:
          type: string
        name:
          type: string
